<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Comentarios · Administración</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background:#10131b; color:#f5f6fa; }
    * { box-sizing:border-box; }
    body { margin:0; padding:20px; }
    main { max-width:1100px; margin:0 auto; }
    h1 { font-size:clamp(22px,4vw,32px); margin:0 0 8px; }
    p, small { color:#a6afc1; line-height:1.5; }
    .card { background:#1c2230; border:1px solid #353c4b; border-radius:14px; padding:18px; margin:14px 0; }
    .login { max-width:420px; }
    label { display:block; margin:10px 0 6px; }
    input, select { width:100%; background:#111722; color:#fff; border:1px solid #4c586d; border-radius:8px; padding:11px; font:inherit; }
    button { border:1px solid #607087; border-radius:8px; background:#2b3445; color:#fff; padding:9px 12px; font:inherit; cursor:pointer; }
    button:hover { background:#39465a; }
    button:disabled { opacity:.5; cursor:default; }
    button.primary { background:#00d3ec; color:#06131b; border-color:#00d3ec; font-weight:700; }
    button.danger { border-color:#a94459; color:#ffb4c2; }
    .toolbar { display:flex; align-items:center; flex-wrap:wrap; gap:10px; margin:16px 0; }
    .toolbar select { width:auto; }
    .toolbar button:last-child { margin-left:auto; }
    .head { display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; }
    .meta { color:#a6afc1; font-size:13px; }
    .message { white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.5; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
    .diagnostics { font-size:12px; color:#b9c5d7; background:#121925; border-radius:8px; padding:10px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .error { color:#ff9fb2; }
    .success { color:#7bf0ae; }
    .nav-tabs { display:flex; gap:8px; margin: 16px 0 20px; border-bottom:1px solid #353c4b; padding-bottom:12px; }
    .tab-btn { background:transparent; border:1px solid transparent; color:#a6afc1; font-weight:600; padding:8px 16px; border-radius:8px; }
    .tab-btn.active { background:#252d3d; border-color:#00d3ec; color:#00d3ec; }
    textarea { width:100%; background:#111722; color:#fff; border:1px solid #4c586d; border-radius:8px; padding:11px; font:inherit; resize:vertical; min-height:100px; }
    .news-tag { display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; padding:3px 8px; border-radius:6px; letter-spacing:0.5px; }
    .tag-novedad { background:rgba(0,211,236,0.18); color:#00d3ec; border:1px solid rgba(0,211,236,0.4); }
    .tag-mejora { background:rgba(123,240,174,0.18); color:#7bf0ae; border:1px solid rgba(123,240,174,0.4); }
    .tag-aviso { background:rgba(255,180,75,0.18); color:#ffb44b; border:1px solid rgba(255,180,75,0.4); }
    .tag-recorrido { background:rgba(192,132,252,0.18); color:#c084fc; border:1px solid rgba(192,132,252,0.4); }
    .news-form-grid { display:grid; grid-template-columns: 2fr 1fr; gap:12px; }
    .metric-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin:14px 0; }
    .metric { background:#121925; border:1px solid #353c4b; border-radius:10px; padding:12px; }
    .metric strong { display:block; font-size:21px; color:#fff; margin-top:3px; }
    .route-map { height:420px; border:1px solid #4c586d; border-radius:12px; overflow:hidden; background:#171d28; }
    .route-review-grid { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(280px,.8fr); gap:14px; }
    .route-list { max-height:420px; overflow:auto; }
    .route-card { padding:12px; margin:0 0 9px; cursor:pointer; }
    .route-card.selected { border-color:#00d3ec; box-shadow:0 0 0 1px #00d3ec inset; }
    .route-status { display:inline-block; border-radius:999px; padding:2px 8px; font-size:11px; font-weight:700; }
    .route-accepted { background:#173b2a; color:#7bf0ae; }
    .route-rejected { background:#482333; color:#ff9fb2; }
    .route-pending { background:#44371c; color:#ffd17c; }
    .route-legend { display:flex; flex-wrap:wrap; gap:14px; margin:10px 0; font-size:13px; color:#b9c5d7; }
    .route-legend span::before { content:''; display:inline-block; width:22px; border-top:4px solid; margin-right:6px; vertical-align:middle; }
    .route-legend .gps::before { border-color:#8f2441; border-top-style:dashed; }
    .route-legend .matched::before { border-color:#21d19f; }
    @media (max-width:600px) { .news-form-grid { grid-template-columns: 1fr; } }
    @media (max-width:800px) { .route-review-grid { grid-template-columns:1fr; } .route-map { height:340px; } }
  </style>
</head>
<body>
<main>
  <h1>Administración · Colectivos</h1>
  <p>Panel privado. Gestión de comentarios y publicación de novedades para usuarios.</p>
  <section id="loginPanel" class="card login">
    <form id="loginForm">
      <label for="password">Contraseña de administración</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit" style="margin-top:12px">Entrar</button>
    </form>
    <p id="loginStatus" role="status"></p>
  </section>
  <section id="adminPanel" hidden>
    <nav class="nav-tabs">
      <button id="tabComments" class="tab-btn active" type="button">✉ Comentarios</button>
      <button id="tabNews" class="tab-btn" type="button">📢 Publicar Novedades</button>
      <button id="tabRoutes" class="tab-btn" type="button">🚌 Auditoría de rutas</button>
      <button id="logout" type="button" style="margin-left:auto;">Salir</button>
    </nav>

    <!-- Pestaña de Comentarios -->
    <div id="sectionComments">
      <div class="toolbar">
        <label for="filter" style="margin:0">Ver</label>
        <select id="filter">
          <option value="todos">Todos</option>
          <option value="nuevo">Nuevos</option>
          <option value="revisado">Revisados</option>
        </select>
        <button id="refresh" type="button">Actualizar</button>
      </div>
      <p id="adminStatus" role="status"></p>
      <div id="comments"></div>
      <button id="more" type="button" hidden>Ver más</button>
    </div>

    <!-- Pestaña de Novedades -->
    <div id="sectionNews" hidden>
      <div class="card">
        <h2 style="font-size:18px; margin:0 0 12px;">Nueva publicación</h2>
        <form id="newsForm">
          <div class="news-form-grid">
            <div>
              <label for="newsTitle">Título</label>
              <input id="newsTitle" type="text" placeholder="Ej: Nueva función de paradas en el mapa" required maxlength="120">
            </div>
            <div>
              <label for="newsTag">Etiqueta</label>
              <select id="newsTag">
                <option value="novedad">Novedad</option>
                <option value="mejora">Mejora</option>
                <option value="aviso">Aviso</option>
                <option value="recorrido">Recorrido</option>
              </select>
            </div>
          </div>
          <label for="newsContent">Mensaje / Detalle</label>
          <textarea id="newsContent" placeholder="Escribí aquí el comunicado o descripción de la actualización..." required maxlength="5000"></textarea>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:14px;">
            <button class="primary" type="submit">Publicar novedad</button>
            <span id="newsPublishStatus" role="status"></span>
          </div>
        </form>
      </div>
      <h2 style="font-size:18px; margin:24px 0 10px;">Novedades publicadas actualmente</h2>
      <div id="newsList"></div>
    </div>

    <!-- Pestaña privada de revisión de map matching -->
    <div id="sectionRoutes" hidden>
      <div id="routeMetrics" class="metric-grid"></div>
      <div class="toolbar">
        <label for="routeFilter" style="margin:0">Resultado</label>
        <select id="routeFilter">
          <option value="all">Todos</option>
          <option value="accepted">Aceptados</option>
          <option value="rejected">Fallidos</option>
          <option value="pending">Pendientes</option>
        </select>
        <label for="routeLine" style="margin:0">Línea</label>
        <input id="routeLine" maxlength="80" placeholder="Todas" style="width:130px">
        <button id="refreshRoutes" type="button">Actualizar</button>
        <button id="runOneRoute" type="button">Validar 1 ahora</button>
      </div>
      <p id="routeStatus" role="status"></p>
      <div class="route-legend">
        <span class="gps">GPS original (máximo 7 días)</span>
        <span class="matched">Geometría ajustada</span>
      </div>
      <div class="route-review-grid">
        <div id="routeMap" class="route-map" aria-label="Comparación del recorrido GPS y su geometría ajustada"></div>
        <div id="routeList" class="route-list"></div>
      </div>
    </div>
  </section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
<script>
  const loginPanel = document.getElementById('loginPanel');
  const adminPanel = document.getElementById('adminPanel');
  const comments = document.getElementById('comments');
  const adminStatus = document.getElementById('adminStatus');
  const more = document.getElementById('more');
  let csrf = null;
  let nextBefore = null;

  async function api(url, options = {}) {
    const response = await fetch(url, { credentials: 'same-origin', cache: 'no-store', ...options });
    const data = await response.json();
    if (!response.ok) {
      if (response.status === 401) showLogin();
      throw new Error(data.error || `Error ${response.status}`);
    }
    return data;
  }

  function showLogin() {
    csrf = null;
    loginPanel.hidden = false;
    adminPanel.hidden = true;
    comments.replaceChildren();
  }

  async function showAdmin() {
    const session = await api('/api/admin/feedback/session');
    if (!session.active) { showLogin(); return; }
    csrf = session.csrf;
    loginPanel.hidden = true;
    adminPanel.hidden = false;
    await loadComments(false);
  }

  function text(tag, content, className = '') {
    const element = document.createElement(tag);
    element.textContent = content;
    if (className) element.className = className;
    return element;
  }

  function action(label, className, handler) {
    const button = text('button', label, className);
    button.type = 'button';
    button.addEventListener('click', handler);
    return button;
  }

  async function changeComment(path, body) {
    await api(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Feedback-CSRF': csrf },
      body: JSON.stringify(body),
    });
    await loadComments(false);
  }

  function renderComment(item) {
    const card = document.createElement('article');
    card.className = 'card';
    const head = document.createElement('div');
    head.className = 'head';
    head.append(
      text('strong', `C-${String(item.id).padStart(6, '0')} · ${item.name || 'Sin nombre'}`),
      text('span', new Date(item.created_at * 1000).toLocaleString('es-PY'), 'meta'),
    );
    card.append(head);
    const meta = [item.category, item.line_id ? `Línea ${item.line_id}` : null, item.status]
      .filter(Boolean).join(' · ');
    card.append(text('div', meta, 'meta'), text('p', item.message, 'message'));
    if (item.diagnostics) {
      card.append(text('div', `Datos técnicos consentidos: ${Object.entries(item.diagnostics)
        .map(([key, value]) => `${key}: ${value}`).join(' · ')}`, 'diagnostics'));
    }
    const actions = document.createElement('div');
    actions.className = 'actions';
    actions.append(action(item.status === 'nuevo' ? 'Marcar revisado' : 'Marcar nuevo', '', async () => {
      try {
        await changeComment('/api/admin/feedback/status', {
          id: item.id, status: item.status === 'nuevo' ? 'revisado' : 'nuevo',
        });
      } catch (error) { adminStatus.textContent = error.message; adminStatus.className = 'error'; }
    }));
    actions.append(action('Eliminar', 'danger', async () => {
      if (!confirm(`¿Eliminar definitivamente el comentario C-${String(item.id).padStart(6, '0')}?`)) return;
      try {
        await changeComment('/api/admin/feedback/delete', { id: item.id });
      } catch (error) { adminStatus.textContent = error.message; adminStatus.className = 'error'; }
    }));
    card.append(actions);
    return card;
  }

  async function loadComments(append) {
    const filter = document.getElementById('filter').value;
    const before = append && nextBefore ? `&before=${nextBefore}` : '';
    adminStatus.textContent = 'Cargando…';
    try {
      const data = await api(`/api/admin/feedback?status=${encodeURIComponent(filter)}&limit=50${before}`);
      if (!append) comments.replaceChildren();
      data.items.forEach(item => comments.append(renderComment(item)));
      nextBefore = data.nextBefore;
      more.hidden = !nextBefore;
      adminStatus.textContent = comments.children.length
        ? `${comments.children.length} comentario(s) cargados` : 'No hay comentarios en este filtro.';
      adminStatus.className = '';
    } catch (error) {
      adminStatus.textContent = error.message;
      adminStatus.className = 'error';
    }
  }

  const tabComments = document.getElementById('tabComments');
  const tabNews = document.getElementById('tabNews');
  const tabRoutes = document.getElementById('tabRoutes');
  const sectionComments = document.getElementById('sectionComments');
  const sectionNews = document.getElementById('sectionNews');
  const sectionRoutes = document.getElementById('sectionRoutes');
  const newsForm = document.getElementById('newsForm');
  const newsTitle = document.getElementById('newsTitle');
  const newsTag = document.getElementById('newsTag');
  const newsContent = document.getElementById('newsContent');
  const newsPublishStatus = document.getElementById('newsPublishStatus');
  const newsList = document.getElementById('newsList');

  let activeTab = 'comments';

  function switchTab(tab) {
    activeTab = tab;
    tabComments.classList.toggle('active', tab === 'comments');
    tabNews.classList.toggle('active', tab === 'news');
    tabRoutes.classList.toggle('active', tab === 'routes');
    sectionComments.hidden = tab !== 'comments';
    sectionNews.hidden = tab !== 'news';
    sectionRoutes.hidden = tab !== 'routes';
    if (tab === 'news') {
      loadNews();
    } else if (tab === 'routes') {
      loadRouteReview();
      setTimeout(() => routeMap?.invalidateSize(), 0);
    }
  }

  tabComments.addEventListener('click', () => switchTab('comments'));
  tabNews.addEventListener('click', () => switchTab('news'));
  tabRoutes.addEventListener('click', () => switchTab('routes'));

  const routeMetrics = document.getElementById('routeMetrics');
  const routeStatus = document.getElementById('routeStatus');
  const routeList = document.getElementById('routeList');
  const routeFilter = document.getElementById('routeFilter');
  const routeLine = document.getElementById('routeLine');
  let routeMap = null;
  let routeLayers = null;

  function ensureRouteMap() {
    if (routeMap) return;
    routeMap = L.map('routeMap', { zoomControl: true }).setView([-25.3, -57.58], 11);
    L.maplibreGL({
      style: 'https://tiles.openfreemap.org/styles/positron',
      attribution: '<a href="https://openfreemap.org/" target="_blank" rel="noopener">OpenFreeMap</a> · © OpenStreetMap',
    }).addTo(routeMap);
    routeLayers = L.layerGroup().addTo(routeMap);
  }

  function metric(label, value) {
    const box = document.createElement('div');
    box.className = 'metric';
    box.append(text('span', label, 'meta'), text('strong', value == null ? '—' : String(value)));
    return box;
  }

  function renderRouteMetrics(health) {
    const rate = health.acceptance_rate == null ? '—' : `${Math.round(health.acceptance_rate * 100)}%`;
    routeMetrics.replaceChildren(
      metric('Aceptados · 30 días', health.accepted_last_30_days),
      metric('Rechazados · 30 días', health.rejected_last_30_days),
      metric('Tasa de aceptación', rate),
      metric('Pendientes', health.pending_jobs),
      metric('TomTom este mes', `${health.monthly_requests}/${health.monthly_limit ?? '—'}`),
    );
  }

  function routeResult(item) {
    if (item.status === 'done') return 'accepted';
    if (item.status === 'failed' || item.result === 'rejected') return 'rejected';
    return 'pending';
  }

  function showRoute(item, card) {
    ensureRouteMap();
    routeLayers.clearLayers();
    routeList.querySelectorAll('.route-card').forEach(node => node.classList.remove('selected'));
    card?.classList.add('selected');
    const bounds = [];
    if (item.points.length >= 2) {
      L.polyline(item.points, { color:'#8f2441', weight:4, opacity:.9, dashArray:'8 7' })
        .bindTooltip('GPS original').addTo(routeLayers);
      item.points.forEach(point => bounds.push(point));
    }
    (item.geometry || []).forEach(part => {
      if (!Array.isArray(part) || part.length < 2) return;
      L.polyline(part, { color:'#21d19f', weight:5, opacity:.9 })
        .bindTooltip('Geometría ajustada').addTo(routeLayers);
      part.forEach(point => bounds.push(point));
    });
    if (bounds.length) routeMap.fitBounds(bounds, { padding:[24,24], maxZoom:17 });
  }

  function renderRouteCard(item) {
    const card = document.createElement('article');
    card.className = 'card route-card';
    const result = routeResult(item);
    const labels = { accepted:'Aceptado', rejected:'Fallido', pending:'Pendiente' };
    const head = document.createElement('div');
    head.className = 'head';
    head.append(text('strong', `Línea ${item.line} · ${item.route || 'Sin ramal'}`),
      text('span', labels[result], `route-status route-${result}`));
    card.append(head, text('div', new Date(item.seen * 1000).toLocaleString('es-PY'), 'meta'));
    const details = [];
    if (item.metrics.minimum_confidence != null) details.push(`confianza mínima ${item.metrics.minimum_confidence}`);
    if (item.metrics.matched_ratio != null) details.push(`${Math.round(item.metrics.matched_ratio*100)}% ajustado`);
    if (item.metrics.offroad_ratio != null) details.push(`${Math.round(item.metrics.offroad_ratio*100)}% fuera de calle`);
    if (item.attempts) details.push(`${item.attempts} intento(s) fallido(s)`);
    if (details.length) card.append(text('div', details.join(' · '), 'meta'));
    if (item.error) card.append(text('p', item.error, 'error'));
    card.addEventListener('click', () => showRoute(item, card));
    return card;
  }

  async function loadRouteReview() {
    ensureRouteMap();
    routeStatus.textContent = 'Cargando auditoría…';
    routeStatus.className = '';
    const line = routeLine.value.trim();
    const query = new URLSearchParams({ status:routeFilter.value, limit:'100' });
    if (line) query.set('line', line);
    try {
      const data = await api(`/api/admin/observed-review?${query}`);
      renderRouteMetrics(data.health);
      routeList.replaceChildren();
      data.items.forEach(item => routeList.append(renderRouteCard(item)));
      routeStatus.textContent = data.items.length
        ? `${data.items.length} recorrido(s). Elegí uno para comparar GPS y geometría.`
        : 'Todavía no hay recorridos para este filtro.';
      if (data.health.warnings?.length) {
        routeStatus.textContent += ` Aviso: ${data.health.warnings.join(' · ')}`;
      }
      if (data.items.length) showRoute(data.items[0], routeList.firstElementChild);
      else routeLayers.clearLayers();
    } catch (error) {
      routeStatus.textContent = error.message;
      routeStatus.className = 'error';
    }
  }

  async function loadNews() {
    newsList.replaceChildren();
    const loading = text('p', 'Cargando novedades…', 'meta');
    newsList.append(loading);
    try {
      const res = await api('/api/news');
      newsList.replaceChildren();
      const items = res.items || [];
      if (!items.length) {
        newsList.append(text('p', 'No hay novedades publicadas aún.', 'meta'));
        return;
      }
      items.forEach(item => newsList.append(renderNewsCard(item)));
    } catch (err) {
      newsList.replaceChildren(text('p', `Error al cargar novedades: ${err.message}`, 'error'));
    }
  }

  function renderNewsCard(item) {
    const card = document.createElement('article');
    card.className = 'card';
    const head = document.createElement('div');
    head.className = 'head';
    const titleBox = document.createElement('div');
    titleBox.style.display = 'flex';
    titleBox.style.alignItems = 'center';
    titleBox.style.gap = '8px';
    const tag = text('span', item.tag || 'novedad', `news-tag tag-${item.tag || 'novedad'}`);
    const title = text('strong', item.title);
    titleBox.append(tag, title);
    head.append(titleBox, text('span', new Date(item.created_at * 1000).toLocaleString('es-PY'), 'meta'));
    card.append(head, text('p', item.content, 'message'));

    const actions = document.createElement('div');
    actions.className = 'actions';
    actions.append(action('Eliminar novedad', 'danger', async () => {
      if (!confirm(`¿Eliminar la publicación "${item.title}"?`)) return;
      try {
        await api('/api/admin/news/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Feedback-CSRF': csrf },
          body: JSON.stringify({ id: item.id }),
        });
        await loadNews();
      } catch (err) {
        alert(`Error al eliminar: ${err.message}`);
      }
    }));
    card.append(actions);
    return card;
  }

  newsForm.addEventListener('submit', async event => {
    event.preventDefault();
    newsPublishStatus.textContent = 'Publicando…';
    newsPublishStatus.className = 'meta';
    try {
      await api('/api/admin/news', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Feedback-CSRF': csrf },
        body: JSON.stringify({
          title: newsTitle.value,
          tag: newsTag.value,
          content: newsContent.value,
        }),
      });
      newsPublishStatus.textContent = '¡Publicado con éxito!';
      newsPublishStatus.className = 'success';
      newsTitle.value = '';
      newsContent.value = '';
      await loadNews();
      setTimeout(() => { newsPublishStatus.textContent = ''; }, 3000);
    } catch (err) {
      newsPublishStatus.textContent = err.message;
      newsPublishStatus.className = 'error';
    }
  });

  document.getElementById('loginForm').addEventListener('submit', async event => {
    event.preventDefault();
    const password = document.getElementById('password');
    const loginStatus = document.getElementById('loginStatus');
    try {
      await api('/api/admin/feedback/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: password.value }),
      });
      password.value = '';
      loginStatus.textContent = '';
      await showAdmin();
    } catch (error) {
      loginStatus.textContent = error.message;
      loginStatus.className = 'error';
    }
  });
  document.getElementById('filter').addEventListener('change', () => loadComments(false));
  document.getElementById('refresh').addEventListener('click', () => {
    if (activeTab === 'comments') loadComments(false);
    else if (activeTab === 'news') loadNews();
    else loadRouteReview();
  });
  document.getElementById('refreshRoutes').addEventListener('click', loadRouteReview);
  document.getElementById('runOneRoute').addEventListener('click', async event => {
    if (!confirm('Esto procesará como máximo un recorrido y puede consumir una solicitud TomTom. ¿Continuar?')) return;
    const button = event.currentTarget;
    button.disabled = true;
    routeStatus.textContent = 'Validando un recorrido en modo sombra…';
    try {
      const result = await api('/api/admin/observed-match/run-one', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'X-Feedback-CSRF':csrf },
        body:'{}',
      });
      routeStatus.textContent = result.attempted
        ? `Prueba terminada: ${result.completed} aceptado(s) de ${result.attempted}.`
        : 'No había recorridos pendientes o no queda presupuesto.';
      await loadRouteReview();
    } catch (error) {
      routeStatus.textContent = error.message;
      routeStatus.className = 'error';
    } finally {
      button.disabled = false;
    }
  });
  routeFilter.addEventListener('change', loadRouteReview);
  routeLine.addEventListener('keydown', event => {
    if (event.key === 'Enter') loadRouteReview();
  });
  more.addEventListener('click', () => loadComments(true));
  document.getElementById('logout').addEventListener('click', async () => {
    try {
      await api('/api/admin/feedback/logout', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Feedback-CSRF': csrf },
        body: '{}',
      });
    } finally { showLogin(); }
  });
  showAdmin().catch(() => showLogin());
</script>
</body>
</html>
